<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GitHub search</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="container">
    <header>
      <span class="logo">devfinder</span>
      <button class="theme-toggle">DARK <img src="./img/moon.svg" alt="ava"></button>
    </header>

    <form class="search-bar">
      <input type="text" placeholder="Search GitHub username…">
      <span class="no-results">no-results</span>
      <button class="seaf">Search</button>
    </form>

    <div class="card">
      <div class="profile">
        <img class="avatar" src="./img/Bitmap.png" alt="Avatar">
        <div class="profile-info">
          <div class="top">
            <h2 class="name">The Octocat</h2>
            <span class="joined">Joined 25 Jan 2011</span>
          </div>
          <p class="username">@octocat</p>

          <p class="bio">This profile has no bio</p>
          
          <div class="stats">
            <div>
              <p>Repos</p><strong>8</strong>
            </div>
            <div>
              <p>Followers</p><strong>3938</strong>
            </div>
            <div>
              <p>Following</p><strong>9</strong>
            </div>
          </div>

          <ul class="links">
            <li><span>📍</span><span class="location">San Francisco</span></li>
            <li><span>🐦</span><span class="twitter">Not Available</span></li>
            <li><span>🔗</span><a class="blog" href="https://github.blog" target="_blank">https://github.blog</a></li>
            <li><span>🏢</span><span class="company">@github</span></li>
          </ul>
        </div>
      </div>
    </div>
  </div>
  <script src="./script.js"></script>
</body>

</html>
